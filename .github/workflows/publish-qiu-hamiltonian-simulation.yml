# Publishes qiu-hamiltonian-simulation to PyPI when it changes on master; see .github/actions/publish-package
name: Publish qiu-hamiltonian-simulation

on:
  push:
    branches:
      - master
    paths:
      - "packages/qiu-hamiltonian-simulation/**"
  workflow_dispatch:

jobs:
  publish:
    name: "Test, build and publish qiu-hamiltonian-simulation"
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write # to publish to PyPI as a trusted publisher, without tokens

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish
        uses: ./.github/actions/publish-package
        with:
          package: qiu-hamiltonian-simulation
          path: packages/qiu-hamiltonian-simulation
