[project]
name = "qiskit-pytest-helper"
version = "0.1.0"
description = "Hypothesis strategies and typed helpers for the unit tests of this monorepo."
readme = "README.md"
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "hypothesis>=6.140.3",
    "numpy>=2.2.6",
    "python-signals",
    "qiskit>=2.2.1",
    "qiskit-aer-encore",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
python-signals = { workspace = true }
qiskit-aer-encore = { workspace = true }
