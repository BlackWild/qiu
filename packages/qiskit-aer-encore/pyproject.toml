[project]
name = "qiskit-aer-encore"
version = "0.1.0"
description = "Qiskit Aer simulators configured for the available hardware, CPU or GPU."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
maintainers = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
keywords = [
    "gpu",
    "qiskit",
    "qiskit-aer",
    "quantum computing",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "python-encore",
    "qiskit-aer>=0.17.2",
]

[project.urls]
Homepage = "https://github.com/BlackWild/qiu/tree/master/packages/qiskit-aer-encore"
Documentation = "https://blackwild.github.io/qiu/qiskit-aer-encore/"
Repository = "https://github.com/BlackWild/qiu"
Issues = "https://github.com/BlackWild/qiu/issues"
Changelog = "https://github.com/BlackWild/qiu/blob/master/packages/qiskit-aer-encore/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# the tests of the package, run with only its declared dependencies on publishing
test = [
    "pytest>=9.0.0",
]

[tool.uv.sources]
python-encore = { workspace = true }
