[project]
name = "python-wave-optics"
version = "0.1.0"
description = "Paraxial wave optics of Gaussian beams through sliced lenses, with a simulation loop for any backend and classical references."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
maintainers = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
keywords = [
    "gaussian beam",
    "lens",
    "optics",
    "paraxial",
    "simulation",
    "split-step",
    "wave optics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.6",
    "python-signals",
]

[project.urls]
Homepage = "https://github.com/BlackWild/qiu/tree/master/shareable-packages/python-wave-optics"
Documentation = "https://blackwild.github.io/qiu/python-wave-optics/"
Repository = "https://github.com/BlackWild/qiu"
Issues = "https://github.com/BlackWild/qiu/issues"
Changelog = "https://github.com/BlackWild/qiu/blob/master/shareable-packages/python-wave-optics/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# the tests of the package, run with only its declared dependencies on publishing
test = [
    "hypothesis>=6.140.3",
    "pytest>=9.0.0",
    "python-pytest-helper",
]

[tool.uv.sources]
python-pytest-helper = { workspace = true }
python-signals = { workspace = true }
