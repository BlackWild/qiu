[project]
name = "python-signals"
version = "0.1.0"
description = "Uniformly sampled axes and signals for classical and quantum numerics."
readme = "README.md"
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "python-encore",
]

[project.optional-dependencies]
sympy = [
    "sympy>=1.14.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
python-encore = { workspace = true }
