[project]
name = "wave-optics-propagation"
version = "0.1.0"
description = "Lens experiments of paraxial wave optics simulated with Qiskit: simulation, cluster runs and the analyses of the paper."
readme = "README.md"
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.6",
    "pandas>=2.2.0",
    "python-signals",
    "python-wave-optics",
    "qiskit>=2.2.1",
    "qiskit-encore",
    "qiskit-hamiltonian-simulation",
    "qiskit-phase-propagator",
    "scipy>=1.15.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
python-signals = { workspace = true }
python-wave-optics = { workspace = true }
qiskit-encore = { workspace = true }
qiskit-hamiltonian-simulation = { workspace = true }
qiskit-phase-propagator = { workspace = true }
