# The configuration shared by the documentation of all packages of the monorepo.
#
# Each package has a `mkdocs.yml` inheriting it (`INHERIT: ../../docs/mkdocs.base.yml`)
# with its `site_name`, and its pages in `docs/`. The API reference of its `src` is
# generated by `docs/gen_reference.py` under `reference/`. `docs/build_all.py` builds
# all packages into one site, each under its directory name.

repo_url: https://github.com/BlackWild/qiu
edit_uri: ""  # no edit links, the pages of the reference are generated

theme:
  name: material
  features:
    - navigation.tabs # puts each item in the nav section as tabs in the header
    - navigation.sections # puts each item in the nav section as sections in the sidebar
    - navigation.indexes # section index pages, e.g. of the modules of a package
    - content.code.copy

# the same structure for every package: an overview with the installation and a quick
# start, a guide to its concepts, worked examples of its use cases, and the reference
nav:
  - Home: index.md
  - User Guide: user-guide.md
  - Examples: examples.md
  - API Reference: reference/

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - gen-files:
      scripts:
        - ../../docs/gen_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_symbol_type_heading: true # indicates `class`, `meth`, `attr`, ...
            show_symbol_type_toc: true # same indications but in toc
            members_order: source # order members as they appear in the source file
            filters:
              - "!^_" # ignore `_` and `__` members
            show_labels: true

            ### Docstrings
            docstring_style: google
            docstring_section_style: list
            show_if_no_docstring: true

            ### Signature
            show_signature: true
            separate_signature: true # show signature on a separate line, not in header
            show_signature_annotations: true
            signature_crossrefs: true # links to the documentation of external types
            show_bases: true

          inventories:
            - url: https://docs.python.org/3/objects.inv
            - url: https://numpy.org/doc/stable/objects.inv
            - url: https://docs.scipy.org/doc/scipy/reference/objects.inv
            - url: https://quantum.cloud.ibm.com/docs/api/qiskit/objects.inv

watch:
  - src
