[project]
name = "qiskit-encore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "qiskit>=2.2.1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "qiskit-aer>=0.17.2",
    "qiskit-pytest-helper",
]

[tool.uv.sources]
qiskit-pytest-helper = { workspace = true }
