[project]
name = "wave-optics-propagation-qutip"
version = "0.1.0"
description = "Lens experiments of paraxial wave optics simulated with QuTiP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
maintainers = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
keywords = [
    "optics",
    "quantum simulation",
    "qutip",
    "wave optics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Private :: Do Not Upload",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.6",
    "python-signals",
    "python-wave-optics",
    "qutip>=5.2.2",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/BlackWild/qiu/tree/master/apps/wave_optics_propagation_qutip"
Documentation = "https://blackwild.github.io/qiu/wave_optics_propagation_qutip/"
Repository = "https://github.com/BlackWild/qiu"
Issues = "https://github.com/BlackWild/qiu/issues"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
python-signals = { workspace = true }
python-wave-optics = { workspace = true }
