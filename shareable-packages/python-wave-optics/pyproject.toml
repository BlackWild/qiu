[project]
name = "python-wave-optics"
version = "0.1.0"
description = "Paraxial wave optics of Gaussian beams through sliced lenses: optical elements, experiment parameters, simulation loop, classical references and storage."
readme = "README.md"
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.6",
    "python-signals",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
python-signals = { workspace = true }
