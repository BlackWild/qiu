# The configuration of pytest, for the tests of all packages run from the repository root.
[pytest]
minversion = "9.0"
# test modules of different packages share basenames, e.g. test_assertions.py
addopts = ["--import-mode=importlib"]
testpaths = ["shareable-packages", "packages", "dev-packages", "apps", "docs"]
# unknown options and markers are errors, and unexpectedly passing xfail tests fail
strict = true
