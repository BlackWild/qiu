# The configuration shared by the documentation site of the monorepo (the root
# `mkdocs.yml`) and the previews of single packages (each package's `mkdocs.yml`), which
# inherit it with `INHERIT`. Its plugins are a mapping, so that the configurations
# inheriting it add their `gen-files` script instead of replacing the plugins.
#
# The pages, the API references and the navigation are generated by
# `docs/gen_pages.py`: the API reference of each package is rendered from the
# docstrings of its `src` by mkdocstrings, and the navigation, `SUMMARY.md`, is read by
# the `literate-nav` plugin.

repo_url: https://github.com/BlackWild/qiu
edit_uri: "" # no edit links, the pages of the site are collected and generated

theme:
  name: material
  features:
    - navigation.sections # the groups of packages as sections of the sidebar, always shown
    - navigation.path # breadcrumbs above each page, back to the landing page
    - navigation.top # a button back to the top of long pages
    - navigation.footer # links to the previous and next pages
    - toc.follow # the table of contents follows the scrolling
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details # collapsible admonitions
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  search: {}
  literate-nav:
    nav_file: SUMMARY.md
  section-index: {} # a package's home page as the page of its section, not Material's
  # `navigation.indexes`, which would make the first package the page of its group
  mkdocstrings:
    handlers:
      python:
        # the packages are found in the environment of `uv sync --all-packages`, where
        # they are installed editable
        options:
          ### Headings and members
          show_root_heading: true # the module as the heading of its page
          heading_level: 1
          show_symbol_type_heading: true # indicates `class`, `meth`, `attr`, ...
          show_symbol_type_toc: true # same indications but in toc
          members_order: source # order members as they appear in the source file
          filters:
            - "!^_" # the public API only: no `_` and `__` members
          show_submodules: false # the submodules have their own pages
          summary: true # tables of the modules, classes and functions of each page
          show_labels: true

          ### Docstrings
          docstring_style: google
          docstring_section_style: list
          docstring_options:
            ignore_init_summary: true
          merge_init_into_class: true # the arguments of `__init__` with the class
          show_if_no_docstring: true

          ### Signature
          show_signature: true
          separate_signature: true # show signature on a separate line, not in header
          show_signature_annotations: true
          signature_crossrefs: true # links to the documentation of the types
          show_bases: true

        inventories:
          - url: https://docs.python.org/3/objects.inv
          - url: https://numpy.org/doc/stable/objects.inv
          - url: https://docs.scipy.org/doc/scipy/reference/objects.inv
          - url: https://quantum.cloud.ibm.com/docs/api/qiskit/objects.inv
