[project]
name = "qiskit-encore"
version = "0.1.0"
description = "Robust circuit building blocks for Qiskit: state preparation, QFT and uniformly controlled rotations as dense unitaries, gates or decomposed circuits."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
maintainers = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
keywords = [
    "qft",
    "qiskit",
    "quantum circuits",
    "quantum computing",
    "state preparation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "numpy>=2.2.6",
    "python-encore",
    "qiskit>=2.2.1",
]

[project.urls]
Homepage = "https://github.com/BlackWild/qiu/tree/master/packages/qiskit-encore"
Documentation = "https://blackwild.github.io/qiu/qiskit-encore/"
Repository = "https://github.com/BlackWild/qiu"
Issues = "https://github.com/BlackWild/qiu/issues"
Changelog = "https://github.com/BlackWild/qiu/blob/master/packages/qiskit-encore/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# the tests of the package, run with only its declared dependencies on publishing
test = [
    "hypothesis>=6.140.3",
    "pytest>=9.0.0",
    "qiskit-aer-encore",
    "qiskit-pytest-helper",
]

[tool.uv.sources]
python-encore = { workspace = true }
qiskit-aer-encore = { workspace = true }
qiskit-pytest-helper = { workspace = true }
