# The documentation site of the monorepo: the landing page, and the documentation of
# every package in a section of its own, with the API reference generated from its
# docstrings. docs/gen_pages.py collects the pages of the packages and writes the
# navigation; docs/build_all.py builds the site strictly and checks its links.
INHERIT: docs/mkdocs.base.yml
site_name: Qiu
site_description: Tools for quantum computing and quantum simulation
site_url: https://blackwild.github.io/qiu/
docs_dir: docs/landing

plugins:
  gen-files:
    scripts:
      - docs/gen_pages.py

# links and anchors between the pages, also between packages, are checked
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

watch:
  - packages
  - packages-dev
  - apps
  - docs
