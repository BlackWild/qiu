# Publishes qiskit-phase-propagator to PyPI when it changes on master; see .github/actions/publish-package
name: Publish qiskit-phase-propagator

on:
  push:
    branches:
      - master
    paths:
      - "packages/qiskit-phase-propagator/**"
  workflow_dispatch:

jobs:
  publish:
    name: "Test, build and publish qiskit-phase-propagator"
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write # to publish to PyPI as a trusted publisher, without tokens

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish
        uses: ./.github/actions/publish-package
        with:
          package: qiskit-phase-propagator
          path: packages/qiskit-phase-propagator
