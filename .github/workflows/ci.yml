name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# a newer push to the same branch or pull request supersedes a running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "Lint and type check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0 # no floating major tags
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # all groups, as pyright also checks the tests, the documentation build and the scripts
      - name: Install all packages of the workspace
        run: uv sync --all-packages --locked # Python from .python-version

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright # configured in pyrightconfig.json, like Pylance in VS Code

  test:
    name: "Test on Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install all packages of the workspace and the test tools
        run: uv sync --all-packages --no-default-groups --group test --locked --python ${{ matrix.python-version }}

      - name: Test, including the examples of the documentation, with coverage
        run: uv run --no-sync pytest -n auto --cov # Hypothesis loads its profile `ci`

  packaging:
    name: "Build and check the packages"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build
        run: uv build --all-packages --out-dir dist

      - name: Check the metadata and that the READMEs render on PyPI
        run: uvx twine check --strict dist/*

  docs:
    name: "Build the documentation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install all packages of the workspace and the documentation tools
        run: uv sync --all-packages --no-default-groups --group docs --locked

      - name: Build, strictly
        run: uv run --no-sync python docs/build_all.py --site-dir site
