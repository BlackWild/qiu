name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: The package and its version, e.g. `qiu-qiskit-encore 0.1.0`.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal example reproducing it
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and the versions of Qiskit and other relevant dependencies.
