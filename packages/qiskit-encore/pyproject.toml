[project]
name = "qiskit-encore"
version = "0.1.0"
description = "Robust circuit building blocks on top of Qiskit."
readme = "README.md"
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "python-encore",
    "qiskit>=2.2.1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "qiskit-aer-encore",
    "qiskit-pytest-helper",
]

[tool.uv.sources]
python-encore = { workspace = true }
qiskit-aer-encore = { workspace = true }
qiskit-pytest-helper = { workspace = true }
