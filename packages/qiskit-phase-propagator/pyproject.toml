[project]
name = "qiskit-phase-propagator"
version = "0.1.0"
description = "Circuits applying phases e^(i f(x)) of signals to quantum states, directly or sample-based."
readme = "README.md"
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.6",
    "python-signals",
    "qiskit>=2.2.1",
    "qiskit-encore",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "qiskit-aer-encore",
    "qiskit-pytest-helper",
]

[tool.uv.sources]
python-signals = { workspace = true }
qiskit-encore = { workspace = true }
qiskit-aer-encore = { workspace = true }
qiskit-pytest-helper = { workspace = true }
