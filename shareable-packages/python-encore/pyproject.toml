[project]
name = "python-encore"
version = "0.1.0"
description = "Small enhancements of the Python standard library, e.g. enums comparing equal to their values."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
maintainers = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
keywords = [
    "enum",
    "standard library",
    "utilities",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BlackWild/qiu/tree/master/shareable-packages/python-encore"
Documentation = "https://blackwild.github.io/qiu/python-encore/"
Repository = "https://github.com/BlackWild/qiu"
Issues = "https://github.com/BlackWild/qiu/issues"
Changelog = "https://github.com/BlackWild/qiu/blob/master/shareable-packages/python-encore/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
