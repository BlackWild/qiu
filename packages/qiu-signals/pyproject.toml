[project]
name = "qiu-signals"
version = "0.1.0"
description = "Uniformly sampled axes and signals on them, sampled or algebraic, for classical and quantum numerics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
maintainers = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
keywords = [
    "axis",
    "fft",
    "fourier",
    "numerics",
    "sampling",
    "signal",
    "sympy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.2.6",
    "qiu-python-encore",
]

[project.optional-dependencies]
sympy = [
    "sympy>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/BlackWild/qiu/tree/master/packages/qiu-signals"
Documentation = "https://blackwild.github.io/qiu/qiu-signals/"
Repository = "https://github.com/BlackWild/qiu"
Issues = "https://github.com/BlackWild/qiu/issues"
Changelog = "https://github.com/BlackWild/qiu/blob/master/packages/qiu-signals/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
# the tests of the package, run with only its declared dependencies on publishing
test = [
    "hypothesis>=6.140.3",
    "pytest>=9.0.0",
    "python-pytest-helper",
    "sympy>=1.14.0",
]

[tool.uv.sources]
python-pytest-helper = { workspace = true }
qiu-python-encore = { workspace = true }
