[project]
name = "qiskit-pytest-helper"
version = "0.1.0"
description = "Quantum state strategies, assertions with Qiskit's equality and circuit helpers for the unit tests of the qiu monorepo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
maintainers = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" },
]
keywords = [
    "hypothesis",
    "pytest",
    "qiskit",
    "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Framework :: Hypothesis",
    "Framework :: Pytest",
    "Private :: Do Not Upload",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "hypothesis>=6.140.3",
    "numpy>=2.2.6",
    "python-pytest-helper",
    "python-signals",
    "qiskit>=2.2.1",
    "qiskit-aer-encore",
]

[project.urls]
Homepage = "https://github.com/BlackWild/qiu/tree/master/dev-packages/qiskit-pytest-helper"
Documentation = "https://blackwild.github.io/qiu/qiskit-pytest-helper/"
Repository = "https://github.com/BlackWild/qiu"
Issues = "https://github.com/BlackWild/qiu/issues"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
python-pytest-helper = { workspace = true }
python-signals = { workspace = true }
qiskit-aer-encore = { workspace = true }
