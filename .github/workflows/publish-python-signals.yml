# Publishes python-signals to PyPI when it changes on master; see .github/actions/publish-package
name: Publish python-signals

on:
  push:
    branches:
      - master
    paths:
      - "shareable-packages/python-signals/**"
  workflow_dispatch:

jobs:
  publish:
    name: "Test, build and publish python-signals"
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write # to publish to PyPI as a trusted publisher, without tokens

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish
        uses: ./.github/actions/publish-package
        with:
          package: python-signals
          path: shareable-packages/python-signals
