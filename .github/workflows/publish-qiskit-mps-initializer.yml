# Publishes qiskit-mps-initializer to PyPI when it changes on master; see .github/actions/publish-package
name: Publish qiskit-mps-initializer

on:
  push:
    branches:
      - master
    paths:
      - "packages/qiskit-mps-initializer/**"
  workflow_dispatch:

jobs:
  publish:
    name: "Test, build and publish qiskit-mps-initializer"
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      contents: read
      id-token: write # to publish to PyPI as a trusted publisher, without tokens

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish
        uses: ./.github/actions/publish-package
        with:
          package: qiskit-mps-initializer
          path: packages/qiskit-mps-initializer
