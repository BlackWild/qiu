[lint.per-file-ignores]
"**/__init__.py" = [
  "I",    # don't auto-sort imports in `__init__.py` files to avoid circular imports
  "D104", # ignore 'missing docstring in public package' in `__init__.py` files
]
"**/tests/*" = [
  "F401", # ignore 'imported but unused' in test files
]

[lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  # pydoclint, whose rules are all in preview: named one by one, see `preview` below
  "DOC102", # documented parameter not in the signature
  "DOC201", # `return` not documented
  "DOC202", # "Returns" section of a function returning nothing
  "DOC402", # `yield` not documented
  "DOC403", # "Yields" section of a function yielding nothing
  "DOC501", # raised exception not documented
  "DOC502", # documented exception not raised
  # pydocstyle
  "D",
  # type-checking
  "TC",
]
ignore = [
  "E501", # line too long
  "D202", # No blank lines allowed after function docstring
]


# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = [
  "F401", # 'imported but unused'
]

# Specify the docstring style to be used for linting.
pydocstyle.convention = "google"

# The preview rules selected by their full codes above, and no others: `explicit-preview-rules`
# keeps prefixes such as "E" or "D" to the stable rules.
preview = true
explicit-preview-rules = true

# a one-line docstring, e.g. """Return the norm of the state.""", needs no sections
pydoclint.ignore-one-line-docstrings = true

# longer line limit for comments
# pycodestyle.max-line-length = 100

[format]
# Enable auto-formatting of code examples in docstrings.
docstring-code-format = true
# Specify the line ending for formatting.
line-ending = "lf"
