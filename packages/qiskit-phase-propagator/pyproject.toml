[project]
name = "qiskit-phase-propagator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siavash Davani", email = "siavash.davani@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "qiskit-signals",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
qiskit-signals = { workspace = true }
qiskit-pytest-helper = { workspace = true }
qiskit-aer-encore = { workspace = true }

[dependency-groups]
dev = [
    "qiskit-aer-encore",
    "qiskit-pytest-helper",
]
